<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TR-069 — simulación local sin equipos</title></head>
<body><div style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#fef08a;text-align:center;font:13px sans-serif">SIMULACIÓN LOCAL · datos ficticios · sin conexión productiva</div><div id="app"></div>
<script type="module">
import { createApp, h } from 'vue';
import { createPinia } from 'pinia';
import { createRouter, createMemoryHistory } from 'vue-router';
import '/src/style.css';
import View from '/src/views/tr069/Tr069View.vue';
import { useAuthStore } from '/src/stores/auth.ts';
import { useTr069Store } from '/src/stores/tr069.ts';
import { useOltStore } from '/src/stores/olt.ts';
import { useScheduleAlertsStore } from '/src/stores/scheduleAlerts.ts';
import { supabase } from '/src/lib/supabase.ts';
const pinia=createPinia(),auth=useAuthStore(pinia),store=useTr069Store(pinia);
auth.role=new URL(location.href).searchParams.get('role')||'ADMIN';auth.user={id:'synthetic-user'};
const deviceId='00259E-HG8145X6%2D13-485754431D3691B7',serial='HWTC1D3691B7';
const timestamp='2026-10-27T19:45:10.554Z';
window.calls=[];window.blocked=[];window.fixtureError=false;
window.fetch=async(...args)=>{window.blocked.push(String(args[0]));throw Error('NETWORK_DISABLED_IN_VISUAL_FIXTURE');};
supabase.from=()=>{const query=new Proxy({}, {get:(_,key)=>key==='then'?(resolve)=>resolve({data:[],error:null}):()=>query});return query;};
const alerts=useScheduleAlertsStore(pinia);alerts.subscribe=()=>{};alerts.unsubscribe=()=>{};
useOltStore(pinia).fetchOntStatusBySerials=async()=>({});
store.fetchDevices=async()=>{store.devices=[{id:'synthetic-huawei',cpe_serial:'485754431D3691B7',model_name:'HG8145X6-13 (simulado)',firmware_version:'V5R023C00S342',last_seen_at:timestamp,service_contract_id:null}];};
window.inventory={found:true,deviceId,serial,lastInform:'2026-10-27T20:32:31.480Z',networks:[
 {path:'InternetGatewayDevice.LANDevice.1.WLANConfiguration.1',ssid:'RAYCO 18',enabled:null,writable:true,timestamp,band:'Banda desconocida'},
 {path:'InternetGatewayDevice.LANDevice.1.WLANConfiguration.5',ssid:'WirelessNet-5G',enabled:null,writable:true,timestamp,band:'Banda desconocida'}]};
window.trialRecord=null;
const trialEnabled=new URL(location.href).searchParams.get('trial')==='1';
store.wifiTrialStatus=async()=>({enabled:trialEnabled,record:structuredClone(window.trialRecord),message:window.trialRecord?'Consulta de estado simulada':'Sin cambios enviados.'});
store.wifiTrialAction=async(requested,action,payload)=>{
 window.calls.push({operation:'TRIAL_'+action.toUpperCase(),serial:requested,payload});
 if(!['ADMIN','SUPERADMIN'].includes(auth.role))throw Error('No tienes permisos');
 if(action==='verify'){
  const op=window.trialRecord.operations.at(-1);op.state='verified';window.inventory.networks[1].ssid=op.after;
  return {enabled:true,record:structuredClone(window.trialRecord),message:'SSID verificado en GenieACS. Comprueba también la red y navegación.'};
 }
 if(!payload.confirmed)throw Error('Sin confirmación');
 const before=window.inventory.networks[1].ssid;
 if(action==='change')window.trialRecord={version:1,serial,deviceId,contractNumber:'CTR-2026-00214',path:window.inventory.networks[1].path,originalSsid:before,originalTimestamp:timestamp,operations:[]};
 window.trialRecord.operations.push({requestId:payload.requestId,kind:action==='restore'?'restore':'change',actorId:'synthetic-user',before,
  after:action==='restore'?window.trialRecord.originalSsid:payload.ssid,sentAt:new Date().toISOString(),state:'queued',taskId:'synthetic-task'});
 return {enabled:true,record:structuredClone(window.trialRecord),message:'Cambio encolado, no confirmado. Espera el próximo Inform y pulsa Verificar resultado.'};
};
store.fetchWifiNetworks=async requested=>{window.calls.push({operation:'GET_CACHE',serial:requested});return structuredClone(window.inventory);};
store.prepareWifiSsid=async(requested,payload)=>{
 window.calls.push({operation:'PREPARE_ONLY',serial:requested,payload});
 if(!['ADMIN','SUPERADMIN'].includes(auth.role))throw Error('No tienes permisos');
 if(window.fixtureError)throw Error('La caché cambió; vuelva a consultar y confirmar');
 const network=window.inventory.networks.find(n=>n.path===payload.path);
 if(!network||payload.deviceId!==deviceId||!payload.confirmed||payload.expectedSsid!==network.ssid)throw Error('Identidad/instancia incorrecta');
 const plan={mode:'preparation_only',deviceId,serial,path:network.path,before:network.ssid,after:payload.ssid,baselineTimestamp:timestamp,baselineInform:window.inventory.lastInform,preparedAt:new Date().toISOString()};
 window.plan=plan;return plan;
};
for(const name of ['setWifi','setPppoe','provisionDevice','rebootDevice','refreshDevice','triggerSync','collectAllMetrics','collectDeviceMetrics'])store[name]=()=>{throw Error('FORBIDDEN_OPERATION_'+name);};
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/:pathMatch(.*)*',component:{template:'<div/>'}}]});
await router.push('/tr069');await router.isReady();
createApp({render:()=>h(View)}).use(pinia).use(router).mount('#app');
window.setRole=role=>auth.role=role;
window.setExplicitBands=()=>{window.inventory.networks[0].band='2.4 GHz';window.inventory.networks[1].band='5 GHz';};
window.ready=true;
</script></body></html>
