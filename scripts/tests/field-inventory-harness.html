<!doctype html><html><head><meta charset="utf-8"></head><body><div id="app"></div>
<script type="module">
// Solo Vite local con claves sintéticas. No iniciar el backend ni sus schedulers.
import { createApp } from 'vue';
import { createPinia, setActivePinia } from 'pinia';
import { createRouter, createMemoryHistory } from 'vue-router';
const id = n => `00000000-0000-4000-8000-${String(n).padStart(12,'0')}`;
const actor=id(1),job=id(2),client=id(3),contract=id(4),unitId=id(10);
const jobType=new URLSearchParams(location.search).get('type') ?? 'installation';
window.__calls=[]; window.confirm=()=>true;
window.__sources=[];window.__deny=0;window.__delayed=[];window.__hold=false;window.__subscriptions=[];
window.EventSource=class {
 constructor(url){this.url=url;this.closed=false;this.handlers={};window.__sources.push(this);queueMicrotask(()=>this.onopen?.());}
 addEventListener(name,fn){this.handlers[name]=fn;}
 close(){this.closed=true;}
};
window.__tick=()=>window.__sources.filter(s=>!s.closed).forEach(s=>s.handlers.invalidate?.({data:'{"v":1}',lastEventId:''}));
await new Promise((resolve,reject)=>{const request=indexedDB.open('smartrayco-campo',1);request.onupgradeneeded=()=>{for(const name of ['closures','drafts'])if(!request.result.objectStoreNames.contains(name))request.result.createObjectStore(name);};request.onsuccess=()=>{request.result.close();resolve();};request.onerror=reject;});
const person={id:client,first_name:'Cliente',last_name:'Simulado',phone:null,address:null};
const service={id:contract,client_id:client,status:'active',client_code:'TEST',plans:null,zones:null};
const product={id:id(6),name:'Equipo de prueba contextual',unit:'unidad',is_active:true,is_serialized:true,current_stock:1,inventory_categories:{slug:'onu'}};
const material={id:id(7),name:'Cable ficticio',unit:'metro',is_active:true,is_serialized:false,current_stock:20};
let movements=[];
const unit={id:unitId,product_id:product.id,serial_number:'SERIE-CONTEXTUAL',mac_address:null,status:jobType==='installation'?'assigned':'pending_approval',client_id:client,contract_id:contract,installation_id:jobType==='installation'?job:null,ticket_id:jobType==='ticket'?job:null,product:{id:product.id,name:product.name,unit:'unidad'}};
const context={jobType,jobId:job,actorId:actor,clientId:client,contractId:contract};
let removed=false;
const receipts=new Map();window.__commitCount=0;
const realFetch=window.fetch.bind(window);
window.fetch=async(input,init={})=>{
 const url=new URL(typeof input==='string'?input:input.url,location.href);
 if(url.origin===location.origin&&!url.pathname.startsWith('/api/'))return realFetch(input,init);
 const method=init.method??'GET';window.__calls.push({path:url.pathname,query:url.search,method,body:init.body?JSON.parse(init.body):null});
 let data=[];
 if(url.pathname.startsWith('/api/campo-inventory/')){
  if(window.__hold)await new Promise(r=>window.__delayed.push(r));
  if(window.__deny)return new Response('{"error":"Asignación no vigente"}',{status:window.__deny,headers:{'Content-Type':'application/json'}});
  const view=url.pathname.split('/').at(-1);
  data={context,items:view==='products'?[product,material]:view==='materials'?movements:view==='assigned'&&jobType==='installation'&&!removed?[unit]:view==='pending'&&jobType==='ticket'&&!removed?[unit]:view==='unit-context'?[unit]:[],next:null};
 }else if(url.pathname.startsWith('/api/'))return new Response('{"error":"Servicio ajeno al escenario"}',{status:503,headers:{'Content-Type':'application/json'}});
 else {
  const table=url.pathname.split('/').at(-1);
  if(table==='clients')data=person;
  if(table==='service_contracts')data=[service];
  if(table==='job_assignees')data=[{job_type:jobType,job_id:job,technician_id:actor,role:'leader',profile:{full_name:'Técnico simulado'}}];
  if(table==='campo_inventory_operation'&&method==='POST'){
    const request=JSON.parse(init.body);
    const fresh=!receipts.has(request.p_operation_id);
    if(fresh){window.__commitCount++;receipts.set(request.p_operation_id,{operationId:request.p_operation_id,jobType:request.p_job_type,jobId:request.p_job_id,action:request.p_action,ids:[id(30)],at:'2026-10-15T12:00:00Z'});}
    if(fresh&&['unassign','unlink','return'].includes(request.p_action))removed=true;
    if(fresh&&request.p_action==='consume')movements=[{id:id(30),product_id:material.id,quantity:request.p_payload.quantity,movement_type:'out',product:material}];
    if(fresh&&new URLSearchParams(location.search).has('lost'))return new Response('Respuesta perdida',{status:502});
    data=receipts.get(request.p_operation_id);
  }
  else if(method!=='GET'&&method!=='HEAD')throw Error('Escritura inesperada');
 }
 return new Response(JSON.stringify(data),{status:200,headers:{'Content-Type':'application/json'}});
};
const pinia=createPinia();setActivePinia(pinia);
const {useAuthStore}=await import('/src/stores/auth.ts');const auth=useAuthStore();auth.user={id:actor};auth.role='TECNICO_RED';auth.loading=false;
window.__auth=auth;
const {supabase}=await import('/src/lib/supabase.ts');
supabase.auth.getSession=async()=>({data:{session:{access_token:'synthetic-session'}},error:null});
supabase.channel=()=>({on(_event,filter){window.__subscriptions.push(filter.table);return this;},subscribe(){return this;}});supabase.removeChannel=async()=> 'ok';
const raw={id:job,client_id:client,contract_id:contract,status:'in_progress',assigned_to:actor,clients:person,title:'Avería sintética',created_at:'2026-10-15T12:00:00Z',scheduled_date:null};
if(jobType==='installation'){const {useInstallationsStore}=await import('/src/stores/installations.ts');useInstallationsStore().installations=[raw];}
else {const {useTicketsStore}=await import('/src/stores/tickets.ts');useTicketsStore().tickets=[raw];}
const {default:Component}=await import('/src/views/campo/CampoTrabajoDetailView.vue');
const {useCampoStore}=await import('/src/stores/campo.ts');
window.__closures=[];
useCampoStore().submitClosure=async payload=>{window.__closures.push(payload);return {queued:true};};
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/campo/:tipo/:id',component:Component}]});
await router.push(`/campo/${jobType}/${job}`);await router.isReady();
const {RouterView}=await import('vue-router');const app=createApp(RouterView).use(pinia).use(router);app.mount('#app');
window.__state=()=>app._instance.subTree.component.setupState;
window.__unmount=()=>app.unmount();
window.__ready=true;
</script></body></html>
