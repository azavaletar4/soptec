<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="app"></div>
<script type="module">
// Real component, real stores, real Auth/REST/Storage. No mocked business responses.
import{createApp,h}from'vue';import{createPinia,setActivePinia}from'pinia';import{createRouter,createMemoryHistory,RouterView}from'vue-router';
import'/src/style.css';import Campo from'/src/views/campo/CampoTrabajoDetailView.vue';import ConfirmHost from'/src/components/ConfirmHost.vue';import ToastHost from'/src/components/ToastHost.vue';
import{useAuthStore}from'/src/stores/auth';import{useCampoStore}from'/src/stores/campo';import{useInstallationsStore}from'/src/stores/installations';import{useTicketsStore}from'/src/stores/tickets';import{useRoutinesStore}from'/src/stores/routines';import{useTechnicianCustodyStore}from'/src/stores/technicianCustody';
const lab=await(await fetch('/lab/config')).json();const pinia=createPinia();setActivePinia(pinia);const auth=useAuthStore();
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/campo/:tipo/:id',component:Campo},{path:'/:pathMatch(.*)*',component:{template:'<p>Laboratorio aislado de custodia.</p>'}}]});
const app=createApp({render:()=>h('div',[h(RouterView,{key:router.currentRoute.value.fullPath}),h(ConfirmHost),h(ToastHost)])});app.use(pinia);app.use(router);await router.isReady();app.mount('#app');
window.__fixture=lab.fixture;window.__auth=auth;window.__router=router;
window.__login=async role=>{const account=lab.accounts.find(a=>a.role===role);if(!account||!account.email.endsWith('@custody-integral.invalid'))throw Error('Synthetic login only');await auth.signOut();await auth.signIn(account.email,account.password);};
window.__openJob=async index=>{const job=lab.fixture.jobs[index];if(!job.id.startsWith('d1650000-'))throw Error('Synthetic job only');const table=job.kind==='installation'?'installations':job.kind==='ticket'?'tickets':'routines';
 const {supabase}=await import('/src/lib/supabase');const{data,error}=await supabase.from(table).select('status').eq('id',job.id).single();if(error)throw error;
 if(data.status!=='in_progress'&&!['completed','resolved'].includes(data.status)){if(job.kind==='installation')await useInstallationsStore().updateStatus(job.id,'in_progress');else if(job.kind==='ticket')await useTicketsStore().updateTicket(job.id,{status:'in_progress'});else await useRoutinesStore().updateRoutine(job.id,{status:'in_progress'});}
 await useCampoStore().fetchAll();await router.push('/campo/'+job.kind+'/'+job.id);};
window.__component=()=>{for(const el of document.querySelectorAll('#app *')){let p=el.__vueParentComponent;while(p){if(p.type.__file?.endsWith('CampoTrabajoDetailView.vue'))return p.setupState;p=p.parent;}}return null;};
window.__routineComponent=()=>{for(const el of document.querySelectorAll('#app *')){let p=el.__vueParentComponent;while(p){if(p.type.__file?.endsWith('RoutineInventory.vue'))return p.setupState;p=p.parent;}}return null;};
window.__custodyStore=useTechnicianCustodyStore();window.__campoStore=useCampoStore();window.__ready=true;
</script></body></html>
