<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba local — InvalidBlob en evidencias fotográficas</title><div id="app"></div>
<script type="module">
import { toSafeFile, toSafeBlob } from '/src/lib/safeBlob.ts';
import { enqueueClosure, listQueuedClosures, removeQueuedClosure } from '/src/lib/offlineQueue.ts';
import { closeCampoDatabase } from '/src/lib/campoDatabase.ts';

// "Blob condenado": simula un File respaldado por un URI de contenido de la
// camara nativa de Android que el sistema ya liberó — leer sus bytes
// (arrayBuffer) rechaza, igual que el caso real que produce
// "Failed to write blobs (InvalidBlob)" si se intenta guardar sin
// materializar antes.
function doomedFile(name) {
  const file = new File(['contenido-nunca-leible'], name, { type: 'image/jpeg' });
  Object.defineProperty(file, 'arrayBuffer', {
    value: () => Promise.reject(new DOMException('El archivo de origen ya no está disponible', 'NotReadableError')),
  });
  return file;
}

window.harness = {
  toSafeFile, toSafeBlob, enqueueClosure, listQueuedClosures, removeQueuedClosure,
  closeCampoDatabase, doomedFile,
  baseClosure: (overrides = {}) => ({
    jobType: 'ticket', jobId: 'job-1', clientId: null, contractId: null, targetStatus: 'resolved',
    latitude: null, longitude: null, ontSerial: null, closureNotes: null,
    photos: [], equipmentPhotos: [], signatureBlob: null,
    clientPhotoCategories: [], pendingApprovalCategories: [],
    motivoAveria: null, motivoAveriaDetalle: null, justificacionCierre: null, potenciaDbm: null,
    napElementoId: null, zoneId: null, ontReplaced: false, installationAddress: null, clientCode: null,
    ...overrides,
  }),
};
window.ready = true;
</script></html>
