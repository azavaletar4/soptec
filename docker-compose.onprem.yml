# SmartRayco — stack ON-PREM con dominio fijo + HTTPS automatico via
# Caddy/Let's Encrypt. La base de datos vive en Supabase (nube); MongoDB
# aqui es solo de GenieACS.
#
# Adaptado de REPLICA-TR069-GENIEACS.md seccion 3.2: se quito el servicio
# freeradius (no usado en SmartRayco).
#
# Uso: docker compose -f docker-compose.onprem.yml up -d --build
name: smartrayco

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks: [smartrayco_net]

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    networks: [smartrayco_net]

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      GENIEACS_NBI: "http://genieacs:7557"
    depends_on:
      genieacs:
        condition: service_healthy
    networks: [smartrayco_net]

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_DATA_DIR: /data/db
      MONGO_LOG_DIR: /var/log/mongodb
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
    networks: [smartrayco_net]
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # "genieacs/genieacs" (usado originalmente aqui, copiado de memoria de
  # REPLICA-TR069-GENIEACS.md/fosmikro) NO EXISTE en Docker Hub — ver
  # docker-compose.yml para el detalle. Se uso drumsergio/genieacs
  # (GeiserX/genieacs-container), imagen "todo en uno" (cwmp/nbi/fs/ui en un
  # solo contenedor), validada localmente contra el simulador de CPE.
  genieacs:
    image: drumsergio/genieacs:1.2.16.0
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      GENIEACS_UI_JWT_SECRET: ${GENIEACS_UI_JWT_SECRET}
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo/genieacs?authSource=admin
      GENIEACS_CWMP_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-cwmp-access.log
      GENIEACS_NBI_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-nbi-access.log
      GENIEACS_FS_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-fs-access.log
      GENIEACS_UI_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-ui-access.log
      GENIEACS_DEBUG_FILE: /var/log/genieacs/genieacs-debug.yaml
      GENIEACS_EXT_DIR: /opt/genieacs/ext
    ports:
      - "7547:7547" # CWMP — Inform de ONTs/CPEs (debe alcanzar la LAN del ISP)
      - "7567:7567" # FS — servidor de archivos/firmware
      - "3001:3000" # UI de GenieACS (no expuesta por Caddy; acceso directo/VPN)
    volumes:
      - genieacs_ext:/opt/genieacs/ext
    networks: [smartrayco_net]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  smartrayco_net:
    driver: bridge

volumes:
  mongo_data:
  mongo_configdb:
  genieacs_ext:
  caddy_data:
  caddy_config:
