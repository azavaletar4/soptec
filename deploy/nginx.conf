server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # La OLT real a veces responde lento por Telnet (visto en vivo, hasta 45s
    # en un solo comando) y "Autorizar ONU" encadena varios pasos contra ella
    # (registrar + TR-069 + senal) — 90s no siempre alcanzaba y cortaba con
    # 504 una operacion que de otro modo hubiera terminado bien.
    proxy_read_timeout 180s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
