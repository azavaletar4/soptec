# SmartRayco — stack de desarrollo para GenieACS (TR-069/CWMP).
#
# Solo levanta GenieACS + MongoDB. El backend/frontend de SmartRayco siguen
# corriendo normal con `npm run dev` — no se dockerizan en desarrollo.
# Adaptado de REPLICA-TR069-GENIEACS.md seccion 3.1 (fosmikro): se quito el
# servicio freeradius (SmartRayco no usa RADIUS, MikroTik maneja PPPoE
# directo desde la Fase 5).
#
# OJO: "genieacs/genieacs" (el nombre de imagen que asumia originalmente
# REPLICA-TR069-GENIEACS.md, copiado de memoria de fosmikro) NO EXISTE en
# Docker Hub ("pull access denied", confirmado al intentar levantar el
# stack). Se uso en su lugar drumsergio/genieacs (alias del proyecto
# GeiserX/genieacs-container, 300k+ pulls, imagen "todo en uno" con los 4
# procesos de GenieACS — cwmp/nbi/fs/ui — en un solo contenedor, a
# diferencia del esquema de 4 contenedores que asumia el doc original).
# Referencia: https://github.com/GeiserX/genieacs-container
#
# Levantar: docker compose up -d
# Ver logs: docker compose logs -f genieacs
# Bajar:    docker compose down
#
# Para probar el flujo TR-069 completo SIN una ONT real con VEIP, levantar
# tambien el simulador de CPE (perfil "testing"):
#   docker compose --profile testing up -d

services:
  mongo:
    image: mongo:8.0
    container_name: smartrayco-genieacs-mongo
    restart: unless-stopped
    environment:
      MONGO_DATA_DIR: /data/db
      MONGO_LOG_DIR: /var/log/mongodb
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
    ports:
      - "27017:27017"
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  genieacs:
    image: drumsergio/genieacs:1.2.16.0
    container_name: smartrayco-genieacs
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      GENIEACS_UI_JWT_SECRET: smartrayco-dev-changeme
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo/genieacs?authSource=admin
      GENIEACS_CWMP_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-cwmp-access.log
      GENIEACS_NBI_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-nbi-access.log
      GENIEACS_FS_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-fs-access.log
      GENIEACS_UI_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-ui-access.log
      GENIEACS_DEBUG_FILE: /var/log/genieacs/genieacs-debug.yaml
      GENIEACS_EXT_DIR: /opt/genieacs/ext
    ports:
      - "7547:7547" # CWMP — Inform de ONTs/CPEs
      - "7557:7557" # NBI — API interna que usa el backend (GENIEACS_NBI)
      - "7567:7567" # FS — servidor de archivos/firmware
      - "3001:3000" # UI — 3001 en el host para no chocar con el Vite dev server (3000)
    volumes:
      - genieacs_ext:/opt/genieacs/ext
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Simulador de CPE (perfil "testing") — permite validar el flujo TR-069
  # completo (Inform -> GenieACS -> tr069-sync -> Supabase) sin depender de
  # una ONT real con VEIP conectada a la OLT. Levantar con:
  #   docker compose --profile testing up -d
  genieacs-sim:
    image: drumsergio/genieacs-sim-container:latest
    container_name: smartrayco-genieacs-sim
    restart: unless-stopped
    depends_on:
      genieacs:
        condition: service_healthy
    profiles: [testing]

volumes:
  mongo_data:
  mongo_configdb:
  genieacs_ext:
